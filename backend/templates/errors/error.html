<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} · {{ title }} · LifeOS AI</title>
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #081120;
            color: #e8eef9;
        }
        main {
            width: min(560px, 100%);
            padding: 34px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.28);
        }
        .code {
            display: inline-flex;
            min-width: 54px;
            min-height: 54px;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: #6d7cff;
            color: #fff;
            font-weight: 900;
        }
        h1 { margin: 20px 0 10px; font-size: clamp(28px, 7vw, 42px); }
        p { margin: 0; color: #a9b5ca; line-height: 1.7; }
        a {
            display: inline-flex;
            margin-top: 24px;
            padding: 12px 18px;
            border-radius: 12px;
            background: #eef2ff;
            color: #172554;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <span class="code">{{ status_code }}</span>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a href="{{ url_for('landing') }}">Return to LifeOS</a>
    </main>
</body>
</html>
