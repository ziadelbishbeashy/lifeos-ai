services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
    ports:
      - "5432:5432"
    volumes:
      - lifeos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      LIFEOS_ENV: development
      SECRET_KEY: local-docker-development-secret-change-me-123456789
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
      DB_BACKEND: postgresql
      AUTO_CREATE_DB: "true"
      FLASK_DEBUG: "false"
      ENABLE_LIFEOS_AUTOMATIONS: "true"
      LIFEOS_AUTOMATION_POLL_SECONDS: "60"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  automation-worker:
    build:
      context: ./backend
    command: ["python", "-m", "workers.automation_worker"]
    environment:
      LIFEOS_ENV: development
      SECRET_KEY: local-docker-development-secret-change-me-123456789
      DATABASE_URL: postgresql://lifeos:lifeos@postgres:5432/lifeos
      DB_BACKEND: postgresql
      AUTO_CREATE_DB: "true"
      FLASK_DEBUG: "false"
      ENABLE_LIFEOS_AUTOMATIONS: "true"
      LIFEOS_AUTOMATION_POLL_SECONDS: "60"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  lifeos_postgres:
